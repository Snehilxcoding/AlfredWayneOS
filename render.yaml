services:
  - type: web
    name: alfred-wayne-os
    runtime: python
    region: singapore # or oregon / frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
