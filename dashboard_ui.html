<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALFRED - Batman Quantum Core Matrix</title>
    <style>
        :root {
            --cyan-glow: #00b3ff;
            --orange-glow: #ff5500;
            --neon-pink: #ff007f;
            --dark-bg: #010206;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            /* Deep radial backdrop grid matrix simulation */
            background-image: 
                radial-gradient(circle at 50% 50%, #081129 0%, #010309 75%, #000002 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 2px, transparent 2px, transparent 4px);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            -webkit-font-smoothing: antialiased;
        }

        /* 3D Viewport Presentation Layer */
        .perspective-container {
            width: 100%;
            height: 100%;
            perspective: 1500px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Master interactive transformer framework */
        .hologram-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            transform: rotateX(44deg) rotateY(-6deg);
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- 3D HEIGHT LAYER STACK CHANNELS --- */
        .layer-logo-backdrop { transform: translateZ(-40px); position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }
        .layer-holo-base    { transform: translateZ(20px); position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }
        .layer-holo-mid     { transform: translateZ(65px); position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }
        .layer-holo-canopy  { transform: translateZ(110px); position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }

        .svg-master {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Hardware Accelerated Keyframes for HUD elements */
        .spin-cw       { transform-origin: 50% 50%; animation: rotateCW 50s linear infinite; }
        .spin-cw-fast  { transform-origin: 50% 50%; animation: rotateCW 18s linear infinite; }
        .spin-ccw      { transform-origin: 50% 50%; animation: rotateCCW 32s linear infinite; }

        /* Neon Glow Drop Filters */
        .glow-cyan   { filter: drop-shadow(0 0 12px var(--cyan-glow)) drop-shadow(0 0 2px #fff); }
        .glow-orange { filter: drop-shadow(0 0 10px var(--orange-glow)); }
        .glow-pink   { filter: drop-shadow(0 0 14px var(--neon-pink)) drop-shadow(0 0 3px #fff); }

        @keyframes rotateCW  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotateCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }


        @keyframes energyCircuitFlow {
            0% { stroke-dashoffset: 800; stroke: var(--cyan-glow); filter: drop-shadow(0 0 8px var(--cyan-glow)); }
            50% { stroke: var(--neon-pink); filter: drop-shadow(0 0 15px var(--neon-pink)); }
            100% { stroke-dashoffset: 0; stroke: var(--cyan-glow); filter: drop-shadow(0 0 8px var(--cyan-glow)); }
        }
        
        @keyframes horizontalPulse {
            0% { opacity: 0.1; transform: scaleX(0.95); }
            100% { opacity: 0.4; transform: scaleX(1.05); }
        }
    </style>
</head>
<body>

    <div class="perspective-container" id="interact-stage">
        <div class="hologram-wrapper" id="holo-rig">
            
            <div class="layer-logo-backdrop">
                <svg class="svg-master" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
                    <g filter="url(#glow-cyan)">
                        <line class="laser-sweep-line" x1="100" y1="360" x2="1100" y2="360" style="animation-delay: 0s;" />
                        <line class="laser-sweep-line" x1="50" y1="400" x2="1150" y2="400" style="animation-delay: 0.5s;" />
                        <line class="laser-sweep-line" x1="100" y1="440" x2="1100" y2="440" style="animation-delay: 1s;" />
                    </g>

                    <g transform="translate(600, 400) scale(1.6)">
                        <path class="batman-silhouette" d="M 0,-35 C 12,-45 20,-65 24,-75 C 28,-60 32,-45 44,-42 C 75,-45 135,-15 175,25 C 145,25 105,5 65,35 C 45,52 25,95 0,105 C -25,95 -45,52 -65,35 C -105,5 -145,25 -175,25 C -135,-15 -75,-45 -44,-42 C -32,-45 -28,-60 -24,-75 C -20,-65 -12,-45 0,-35 Z" />
                        
                        <path class="neon-energy-conduit" d="M 0,-35 C 12,-45 20,-65 24,-75 C 28,-60 32,-45 44,-42 C 75,-45 135,-15 175,25 C 145,25 105,5 65,35 C 45,52 25,95 0,105 C -25,95 -45,52 -65,35 C -105,5 -145,25 -175,25 C -135,-15 -75,-45 -44,-42 C -32,-45 -28,-60 -24,-75 C -20,-65 -12,-45 0,-35 Z" />
                    </g>
                </svg>
            </div>

            <div class="layer-holo-base">
                <svg class="svg-master" viewBox="0 0 1200 800">
                    <defs>
                        <path id="text-track-outer" d="M 600,400 m -240,0 a 240,240 0 1,1 480,0 a 240,240 0 1,1 -480,0" />
                        <path id="text-track-inner" d="M 600,400 m -175,0 a 175,175 0 1,1 350,0 a 175,175 0 1,1 -350,0" />
                    </defs>

                    <g class="spin-ccw">
                        <circle cx="600" cy="400" r="290" fill="none" stroke="var(--cyan-glow)" stroke-width="1.5" stroke-dasharray="140 250 40 120" opacity="0.3" filter="url(#glow-cyan)"/>
                    </g>
                    <g class="spin-cw">
                        <circle class="glow-cyan" cx="600" cy="400" r="265" fill="none" stroke="var(--cyan-glow)" stroke-width="4.5" stroke-dasharray="14 10 4 6" />
                    </g>
                </svg>
            </div>

            <div class="layer-holo-mid">
                <svg class="svg-master" viewBox="0 0 1200 800">
                    <g class="spin-cw-fast">
                        <circle class="glow-orange" cx="600" cy="400" r="240" fill="none" stroke="var(--orange-glow)" stroke-width="5" stroke-dasharray="280 40 20 45 80 40" />
                    </g>
                    <g class="spin-ccw">
                        <circle class="glow-orange" cx="600" cy="400" r="228" fill="none" stroke="var(--orange-glow)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.8" />
                    </g>

                    <g class="spin-cw" style="animation-duration: 65s; transform-origin: 600px 400px;">
                        <text fill="var(--orange-glow)" font-size="8" font-weight="bold" letter-spacing="3" opacity="0.8">
                            <textPath href="#text-track-outer" startOffset="0%">BATMAN_BATCAVE_MAINFRAME // SECURE_LINK_ACTIVE</textPath>
                        </text>
                        <text fill="var(--cyan-glow)" font-size="6.5" font-weight="bold" letter-spacing="4" opacity="0.7">
                            <textPath href="#text-track-inner" startOffset="50%">ALFRED_AI_COGNITION // SYSTEM_CONNECTED</textPath>
                        </text>
                    </g>
                </svg>
            </div>

            <div class="layer-holo-canopy">
                <svg class="svg-master" viewBox="0 0 1200 800">
                    <circle class="glow-cyan" cx="600" cy="400" r="195" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="130 35 85 15" opacity="0.95" />
                    
                    <circle class="glow-orange" cx="600" cy="400" r="155" fill="none" stroke="var(--orange-glow)" stroke-width="6" stroke-dasharray="6 8" stroke-dashoffset="120" transform="rotate(-45 600 400)" />
                    
                    <circle class="glow-cyan" cx="600" cy="400" r="115" fill="none" stroke="var(--cyan-glow)" stroke-width="2" />

                    <g stroke="var(--cyan-glow)" stroke-width="1.5" opacity="0.8" class="glow-cyan">
                        <line x1="600" y1="270" x2="600" y2="282" />
                        <line x1="600" y1="518" x2="600" y2="530" />
                        <line x1="470" y1="400" x2="482" y2="400" />
                        <line x1="718" y1="400" x2="730" y2="400" />
                    </g>
                </svg>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const holoRig = document.getElementById('holo-rig');
            const stage = document.getElementById('interact-stage');

            // --- 3D INTERACTIVE KINETIC MOUSE PARALLAX RIG ---
            stage.addEventListener('mousemove', (e) => {
                const rect = stage.getBoundingClientRect();
                // Map coordinate positions relative to window center grid (-0.5 to 0.5)
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                
                // Add proportional matrix angle tilts across separate height vectors
                const rotateX = 44 - (y * 24);
                const rotateY = -6 + (x * 24);
                
                holoRig.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            stage.addEventListener('mouseleave', () => {
                // Return smoothly to normal baseline alignment upon mouse cursor exit
                holoRig.style.transform = `rotateX(44deg) rotateY(-6deg)`;
            });
        });
    </script>
</body>
</html>
